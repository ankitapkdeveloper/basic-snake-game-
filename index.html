<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#151a25">
  <title>Catapult King — Test Build</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <div class="brand">🏰 Catapult King</div>
        <div class="sub">Aim • Launch • Conquer</div>
      </div>
      <div class="top-actions">
        <button id="pauseBtn" class="pill">Pause</button>
        <button id="restartBtn" class="pill">↻</button>
      </div>
    </header>

    <section class="hud">
      <div><span>LEVEL</span><b id="level">1</b></div>
      <div><span>SCORE</span><b id="score">0</b></div>
      <div><span>SHOTS</span><b id="shots">6</b></div>
      <div><span>BEST</span><b id="best">0</b></div>
    </section>

    <section class="stage-wrap">
      <canvas id="game" width="960" height="640" aria-label="Catapult game"></canvas>
      <div id="help" class="help">
        <strong>Drag the stone backward</strong>
        <span>Aim toward the fortress, then release.</span>
      </div>
      <div id="toast" class="toast"></div>
    </section>

    <section class="bottom-panel">
      <div class="status" id="status">Destroy the king's target.</div>
      <div class="power-row">
        <span>POWER</span>
        <div class="power"><i id="powerBar"></i></div>
      </div>
      <div class="controls-row">
        <button id="trajectoryBtn" class="control">Trajectory <b id="trajectoryState">ON</b></button>
        <button id="newLevelBtn" class="control">Next Fortress</button>
      </div>
    </section>
  </main>

  <div id="result" class="overlay">
    <div class="result-card">
      <div class="result-icon" id="resultIcon">🏆</div>
      <div class="eyebrow">BATTLE COMPLETE</div>
      <h2 id="resultTitle">Fortress Destroyed!</h2>
      <div class="result-score" id="resultScore">0</div>
      <div class="result-meta">
        <span id="resultShots">0 shots left</span>
        <span id="resultBonus">+0 bonus</span>
      </div>
      <button id="againBtn" class="primary">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
