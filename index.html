<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Snake Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>🐍 Snake Game</h1>

    <div class="topbar">
      <div class="score-box">Score: <span id="score">0</span></div>
      <button id="pauseBtn" type="button">Pause</button>
    </div>

    <canvas id="gameCanvas" width="400" height="400" aria-label="Snake game"></canvas>

    <div id="message" class="message">Use arrow keys or the buttons below to play.</div>

    <div class="controls">
      <button class="control up" data-direction="up" aria-label="Move up">▲</button>
      <button class="control left" data-direction="left" aria-label="Move left">◀</button>
      <button class="control down" data-direction="down" aria-label="Move down">▼</button>
      <button class="control right" data-direction="right" aria-label="Move right">▶</button>
    </div>

    <button id="restartBtn" class="restart" type="button">Restart Game</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
